site_name: QRF Infrastructure
site_description: Quantitative Research Fund — Systematic Trading Infrastructure Documentation
site_url: https://qrfzurich.com/docs
site_author: Quantitative Research Fund

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
    - scheme: qrf-dark
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    admonition:
      note: material/pencil-outline
      abstract: material/text-box-outline
      info: material/information-outline
      tip: material/lightbulb-outline
      warning: material/alert-outline
      example: material/code-tags
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mermaid-init.js

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ETH-Quant-Research-Group/Infrastructure
    - icon: fontawesome/solid/globe
      link: https://qrfzurich.com

plugins:
  - search:
      separator: '[\s\-\.]'
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            docstring_style: google
            docstring_section_style: table
            merge_init_into_class: true
            heading_level: 3

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - tables
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Strategies:
    - Overview: strategies/index.md
    - Writing a Strategy: strategies/writing-a-strategy.md
  - Components:
    - Data Feed: components/data-feed.md
    - Strategy Worker: components/strategy-worker.md
    - Consolidator: components/consolidator.md
    - Dashboard: components/dashboard.md
  - API Reference:
    - Strategy: api/strategy.md
    - Broker: api/broker.md
    - Signals: api/signals.md
    - Execution Types: api/execution-types.md

copyright: >
  Copyright &copy; 2026 Quantitative Research Fund &middot; ETH Zurich
